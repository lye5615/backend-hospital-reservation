spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospitalproject
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 개발 중에는 update, 실제 운영은 validate 또는 none 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: true